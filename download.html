<!DOCTYPE html>
<html dir="rtl" lang="ar">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">

      <script src="js/links.js" type="text/javascript"></script>
      <link rel="stylesheet" type="text/css" href="css/menu.css">
      <link rel="stylesheet" type="text/css" media="screen and (max-width: 767px)" href="css/smallscreen.css">
      <link rel="stylesheet" type="text/css" media="screen and (min-width: 768px)" href="css/widescreen.css">

      <title>Download</title>
   </head>
   <body onload="funclinks()">
      <navbar class="navbar-a">
         <input class="menu-btn" type="checkbox" id="menu-btn" />
         <label class="menu-icon" for="menu-btn"><span class="navicon"></span></label>
         <ul class="menu" id="links">
         </ul>
      </navbar>
<div class="container">
  <h1 class="space">
    التنزيل Download 
  </h1><h2 style="color: #ff0000">(تحت التطوير)</h2>
  <div class="whitebox">
    <form id="downloadForm" action="https://formspree.io/f/xpwyyljp" method="POST">
      <div>
        <label for="filename">الملف:<br>
          <select name="filename" id="filename">
            <option value="" selected disabled hidden>اختر ملف...</option>
            <option value="Inst64Bit16Ar.zip">64 بت (64Bit16)</option>
            <option value="Inst32Bit16Ar.zip">32 بت (32Bit16)</option>
            <option value="Inst32Bit14Ar.zip">2010 (32Bit14)</option>
          </select>
          <div id="filedate" style="font-size: 0.6rem;">جاري جلب البيانات...</div>
        </label>
      </div>
      <div>
        <label for="email">بريدك الإلكتروني:<br>
          <input type="email" name="_replyto" required>
        </label>
      </div>
      <div>
        <label for="country">الدولة:<br>
          <select name="country" id="country" required>
            <option value="">-- اختر الدولة --</option>
            <option value="اليمن">اليمن</option>
            <option value="السعودية">السعودية</option>
            <option value="مصر">مصر</option>
            <option value="الإمارات">الإمارات</option>
            <option value="قطر">قطر</option>
            <option value="الكويت">الكويت</option>
            <option value="البحرين">البحرين</option>
            <option value="عمان">عمان</option>
            <option value="الأردن">الأردن</option>
            <option value="فلسطين">فلسطين</option>
            <option value="العراق">العراق</option>
            <option value="سوريا">سوريا</option>
            <option value="لبنان">لبنان</option>
            <option value="الجزائر">الجزائر</option>
            <option value="المغرب">المغرب</option>
            <option value="تونس">تونس</option>
            <option value="ليبيا">ليبيا</option>
            <option value="السودان">السودان</option>
            <option value="موريتانيا">موريتانيا</option>
            <option value="الصومال">الصومال</option>
            <option value="جزر_القمر">جزر القمر</option>
            <option value="Other">Other</option>
          </select>
        </label>
      </div>
      <br>
      <div>
        <button type="submit">بدء التنزيل</button>
      </div>
    </form>
  </div>
  <footer>
    <div></div>
  </footer>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const file = params.get("file");
  if (file) {
    document.getElementById("filename").value = file;
  }
  const form = document.getElementById("downloadForm");
  form.addEventListener("submit", async function(e) {
    e.preventDefault();
    const data = new FormData(form);
    const response = await fetch(form.action, {
      method: form.method,
      body: data,
      headers: { 'Accept': 'application/json' }
    });
    if (response.ok) {
      window.location.href = file;
    } else {
      alert("حدث خطأ أثناء الإرسال، حاول مرة أخرى.");
    }
  });

window.addEventListener("load", function() {
  const filenameField = document.getElementById("filename");
  
  if (filenameField && filenameField.value.trim() === "") {
    window.location.href = "index.html";
  }
});

async function updateFileDate() {
    const displayDiv = document.getElementById('filedate');
    const fileName = document.getElementById('filename').value;

    if (!fileName) return;

try {
  const response = await fetch(fileName, { method: 'HEAD' });
  const contentType = response.headers.get('Content-Type') || "";
  
  if (!response.ok || response.status === 404 || contentType.includes("text/html")) {
    displayDiv.innerHTML = "الملف غير موجود";
    return;
  }
  
  const jsonResponse = await fetch('files_info.json');
  const data = await jsonResponse.json();
  
  if (data[fileName]) {
    const dateObj = new Date(data[fileName]);
    const formattedDate = dateObj.toLocaleDateString('ar-EG', {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
    displayDiv.innerHTML = `آخر تحديث: <b>${formattedDate}</b>`;
  } else {
    displayDiv.innerHTML = "آخر تحديث #/#/#.";
  }
  
} catch (error) {
  displayDiv.innerHTML = "الملف غير موجود";
}
}
document.getElementById('filename').addEventListener('change', updateFileDate);
window.addEventListener('DOMContentLoaded', updateFileDate);
</script>
   </body>
</html>
