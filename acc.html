<!DOCTYPE html>
<html dir="rtl" lang="ar">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <script src="js/links.js" type="text/javascript"></script>
      <link rel="stylesheet" type="text/css" href="css/menu.css">
      <link rel="stylesheet" type="text/css" media="screen and (max-width: 767px)" href="css/smallscreen.css">
      <link rel="stylesheet" type="text/css" media="screen and (min-width: 768px)" href="css/widescreen.css">

      <title></title>
   </head>
   <body onload="funclinks();">
    <nav>
      <navbar class="navbar-a">
        <input class="menu-btn" type="checkbox" id="menu-btn" />
        <label class="menu-icon" for="menu-btn"><span class="navicon"></span></label>
        <ul class="menu" id="links"></ul>
      </navbar>
    </nav>
<div class="container">
         <h1 class="space">
           طلب رمز تفعيل
         </h1>
	<div class="whitebox">
<form onsubmit="return validateInputs()" action="https://formspree.io/f/xpwyyljp" method="POST">
      <div>
          <label for="rm">الرمز الأساسي:<br>
              <input type="text" name="rm" id="rm" placeholder="أدخل الرمز الأساسي" required>
          </label>
          <a id="link1" href="#">عرض</a>
      </div>
      <div>
        <label for="rf">رمز الميزات:<br>
          <input type="text" name="rf" id="rf" placeholder="أدخل رمز الميزات" required>
        </label>
        <a id="link2" href="#">عرض</a>
      </div>
      <div>
        <label for="name">الاسم:<br>
		<input type="text" name="name" required>
        </label>
      </div>
      <div>
        <label for="email">البريد الإلكتروني:<br>
		<input type="email" name="_replyto" required>
        </label>
      </div>
      <div>
        <label for="country">الدولة:<br>
          <select name="country" id="country" required>
            <option value="">-- اختر الدولة --</option>
            <option value="اليمن">اليمن</option>
            <option value="السعودية">السعودية</option>
            <option value="مصر">مصر</option>
            <option value="الإمارات">الإمارات</option>
            <option value="قطر">قطر</option>
            <option value="الكويت">الكويت</option>
            <option value="البحرين">البحرين</option>
            <option value="عمان">عمان</option>
            <option value="الأردن">الأردن</option>
            <option value="فلسطين">فلسطين</option>
            <option value="العراق">العراق</option>
            <option value="سوريا">سوريا</option>
            <option value="لبنان">لبنان</option>
            <option value="الجزائر">الجزائر</option>
            <option value="المغرب">المغرب</option>
            <option value="تونس">تونس</option>
            <option value="ليبيا">ليبيا</option>
            <option value="السودان">السودان</option>
            <option value="موريتانيا">موريتانيا</option>
            <option value="الصومال">الصومال</option>
            <option value="جزر_القمر">جزر القمر</option>
            <option value="Other">Other</option>
          </select>
        </label>
      </div>
      <div>
  <label for="payment">اختر طرق الدفع المفضلة لديك:<br>
  <select id="payment" name="payment[]" multiple size="7" required>
      <option value="bank_transfer">تحويل بنكي</option>
      <option value="western_union">ويسترن يونيون</option>
      <option value="moneygram">موني جرام</option>
      <option value="hawala">حوالة عبر مكتب صرافة</option>
      <option value="Elect_pay">دفع إلكتروني</option>
      <option value="cryptocurrency">عملات رقمية</option>
      <option value="other">- - - آخر - - -</option>
  </select>
  </label>
      </div>
      <div>
       <label>
         المؤسسة التعليمية:<br>
         <input type="text" name="institute" placeholder="اسم المعهد" required>
       </label>
      </div>
      <div>
       <label>
         الموقع/ الصفحة:<br>
         <input dir="ltr" type="url" name="website" placeholder="https://" required>
       </label>
      </div>
      <div>
        <label>
          ملاحظات:<br>
          <input type="text" name="message">
        </label>
      </div>
      <br>
	<button type="submit">إرسال</button>
        <input type="reset" name="reset" value="مسح" />
    </form>
    </div>
         <footer>
		<div>
		</div>
         </footer>
</div>

<script>
  // دالة للتحقق من النص
  function validateInput(value) {
    return value.toUpperCase().startsWith("RQ");
  }

  // ملء الحقول من الرابط عند تحميل الصفحة
  window.addEventListener("load", function() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('rm')) document.getElementById('rm').value = decodeURIComponent(urlParams.get('rm'));
    if (urlParams.get('rf')) document.getElementById('rf').value = decodeURIComponent(urlParams.get('rf'));
  });

  document.addEventListener('DOMContentLoaded', function() {
    
    // دالة المعالجة عند الضغط
    function handleLinkClick(event, inputId) {
      event.preventDefault();
      var val = document.getElementById(inputId).value.trim();
      
      if (!val) {
        alert('الرجاء إدخال قيمة');
        return;
      }
      
      if (!validateInput(val)) {
        alert("الرمز غير صحيح");
        return;
      }
      
      var targetPage = val.toLowerCase().includes('f') ? 'acf.html' : 'acm.html';
      var finalUrl = targetPage + '?rq=' + encodeURIComponent(val);
      
      // إعادة التوجيه
      window.location.href = finalUrl;
    }

    // ربط الأحداث بالأزرار
    document.getElementById('link1').addEventListener('click', function(e) {
      handleLinkClick(e, 'rm');
    });

    document.getElementById('link2').addEventListener('click', function(e) {
      handleLinkClick(e, 'rf');
    });
  });

  function validateInputs() {
    const rm = document.getElementById('rm').value.trim();
    const rf = document.getElementById('rf').value.trim();

    if (!rm.toUpperCase().startsWith("RQ") || !rf.toUpperCase().startsWith("RQ")) {
      alert("خطأ: يجب إدخال رموز صحيحة");
      return false; 
    }
    return true;
  }
</script>

   </body>
</html>
