<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تفعيل النظام</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #1e40af;
            --success: #16a34a;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --text: #1e293b;
            --white: #ffffff;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 8px auto;
            padding: 20px;
        }

        .card {
            background: var(--white);
            border-radius: 15px;
            box-shadow: var(--shadow);
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .request-badge {
            display: inline-block;
            background: #dbeafe;
            color: var(--primary);
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .price-tag {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text);
            margin: 20px 0;
            text-align: center;
        }

        .price-tag span {
            font-size: 1rem;
            color: #64748b;
            font-weight: normal;
        }

        .grid-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 25px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1rem;
        }
        th, td {
            padding: 4px 6px;
            text-align: right;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background-color: #f9fafb;
        }
        .highlight {
            background-color: #fef9e3;
        }
        .currency {
            font-weight: bold;
            color: #2c7a4d;
        }
        .sar-row {
            background-color: #f1f5f9;
            font-weight: 500;
        }
        .sar-amount {
            color: #b45309;
            font-weight: bold;
        }
        .error-message {
            text-align: center;
            padding: 30px;
            color: #e53e3e;
            background: #fff5f5;
        }
        @media (max-width: 600px) {
            .grid-info { grid-template-columns: 1fr; }
            th,
            td {
                padding: 10px 12px;
                font-size: 0.9rem;
            }
        }

        .info-box {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .unit-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .unit-item {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 0.85rem;
        }

        .payment-methods {
            margin-top: 30px;
        }

        .btn-pay {
            display: block;
            background: var(--success);
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .btn-pay:hover { background: #15803d; transform: translateY(-2px); }

        .bank-details {
            border: 1px dashed #cbd5e1;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .copy-val { font-family: monospace; font-weight: bold; color: var(--primary); }

        footer { text-align: center; color: #64748b; font-size: 0.85rem; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header-section">
            <h1 style="margin:0; color: var(--primary);">تفعيل أساسي</h1>
            <p>دائم (لجهاز واحد لمرة واحدة)</p>
            <div class="request-badge">رمز الطلب المرجعي: <span id="req-code-display">----</span></div>
        </div>

        <div class="price-tag">
    <table>
                <thead>
                    <tr>
                        <th>الميزة</th>
                        <th>السعر</th>
                    </tr>
                </thead>
        <tbody id="product-table">
            <tr><td colspan="2" class="error-message">جاري التحميل...</td></tr>
        </tbody>
    </table>
        </div>

        <div class="grid-info">
            <div class="info-box">
                <strong>المنتج:</strong>
                <p>رمز تفعيل: لتفعيل الاستخدام الدائم وتمكين الحد الأقصى من السجلات فقط.</p>
            </div>
            <div class="info-box" style="border-right: 3px solid #ef4444;">
                <strong>لا يشمل:</strong>
                <p>لا يشمل الميزات الإضافية،<br>لا يشمل الدعم الفني،<br>لا يشمل اشتراك Microsoft Office.</p>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 40px 0;">

        <div class="payment-methods">
            <a href="#" id="pay-link" class="btn-pay">موافق</a>
        </div>
    </div>
</div>

<footer>
2026 © جميع الحقوق محفوظة
</footer>

<script>
    // دالة لجلب الباراميتر من الرابط
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    window.onload = function() {
        const requestCode = getQueryParam('rq') || "لم يحدد";
        
        // تحديث النصوص في الصفحة
        document.getElementById('req-code-display').innerText = requestCode;
        const refElements = document.getElementsByClassName('req-val');
        for(let el of refElements) {
            el.innerText = requestCode;
        }

        // تحديث رابط الدفع الإلكتروني ليشمل الرمز
        const payLink = document.getElementById('pay-link');
        const basePayUrl = "reqactive.html"; // استبدل برابط بوابتك
        payLink.href = `${basePayUrl}?rq=${encodeURIComponent(requestCode)}`;
    };


    // دالة لاستخراج القيمة الرقمية من السعر (تتعامل مع نصوص مثل "$100" أو "free")
    function extractNumericPrice(price) {
        if (price === undefined || price === null) return NaN;
        const cleaned = price.toString().replace(/[^0-9.]/g, '');
        const num = parseFloat(cleaned);
        return isNaN(num) ? NaN : num;
    }
    
    // جلب البيانات من ملف data.json 
    fetch('acf.json')
        .then(response => {
            if (!response.ok) {
                throw new Error('فشل تحميل الملف');
            }
            return response.json();
        })
        .then(data => {
            // البحث عن العنصر الذي id === 1
            const item = data.find(item => item.id === 1);
            
            if (!item) {
                document.getElementById('product-table').innerHTML = `
                        <tr><td colspan="2">لا يوجد منتج بالمعرف 1</td></tr>
                    `;
                return;
            }
            
            const numericPrice = extractNumericPrice(item.price);
            const isValidPrice = !isNaN(numericPrice);
            const sarAmount = isValidPrice ? (numericPrice * 3.8).toFixed(2) : 'غير متوفر';
            
            // إنشاء محتوى الجدول: سطر للمنتج وسطر للتحويل
            const tableHTML = `
                    <tr>
                        <td>${item.name}</td>
                        <td>${item.price}</td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>${isValidPrice ? sarAmount + ' ر.س' : 'لا يمكن التحويل'}</td>
                    </tr>
                `;
            
            document.getElementById('product-table').innerHTML = tableHTML;
        })
        .catch(error => {
            console.error('خطأ:', error);
            document.getElementById('product-table').innerHTML = `
                    <tr><td colspan="2">حدث خطأ أثناء تحميل البيانات</td></tr>
                `;
        });
</script>
</body>
</html>
